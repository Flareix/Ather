<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aether Quests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500;1,700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --vh:100vh;
  --ink:#1B3A5C;
  --ink-soft:#4B6784;
  --paper:#F1F6EC;
  --leaf:#4FBF6A;
  --leaf-deep:#2E8B57;
  --leaf-dark:#1F6B41;
  --gold:#FFC94D;
  --gold-deep:#C98F1A;
  --wood-edge:#B58C55;
  --wood-ink:#4A3418;
  --display:'Marcellus','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --cam:1.5s cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Alegreya',Georgia,'Times New Roman',serif;font-size:18px;line-height:1.55;color:var(--ink);background:#2A8FEF;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;border-radius:6px}

/* ---------- world layers ---------- */
.layer{position:fixed;left:0;right:0;top:0;pointer-events:none;will-change:transform;transition:transform var(--cam)}
.world{position:fixed;left:0;right:0;top:0;height:calc(var(--vh)*3);z-index:2;will-change:transform;transition:transform var(--cam)}
.no-anim .layer,.no-anim .world{transition:none!important}
.sky{z-index:0;height:calc(var(--vh)*3);background:linear-gradient(180deg,#030820 0%,#071541 11%,#0E2A6B 21%,#1F56B0 29%,#2C86E4 34%,#3DA2F4 45%,#6EC3FA 60%,#93D6FF 67%,#B4E4FF 80%,#DDF3FF 92%,#EEF9FF 100%)}
.far{z-index:1;height:calc(var(--vh)*3)}
.near{z-index:3;height:calc(var(--vh)*4)}
.zone{position:relative;height:var(--vh);overflow:hidden}
.scroller{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.55) transparent}
#scroll-0{overflow-x:auto}
#roots{position:relative}
.z-roots .edge-top{position:absolute;top:16px;left:50%;transform:translateX(-50%);margin:0;z-index:2}
.z-roots .edge-top:active{transform:translateX(-50%) translateY(2px)}
.puff{position:absolute;--o:.95;background:
  radial-gradient(closest-side,rgba(255,255,255,var(--o)) 55%,rgba(255,255,255,0)) 0% 70%/42% 62% no-repeat,
  radial-gradient(closest-side,rgba(255,255,255,var(--o)) 55%,rgba(255,255,255,0)) 28% 30%/40% 86% no-repeat,
  radial-gradient(closest-side,rgba(255,255,255,var(--o)) 55%,rgba(255,255,255,0)) 58% 16%/44% 100% no-repeat,
  radial-gradient(closest-side,rgba(255,255,255,var(--o)) 55%,rgba(255,255,255,0)) 86% 55%/36% 70% no-repeat,
  radial-gradient(closest-side,rgba(255,255,255,var(--o)) 55%,rgba(255,255,255,0)) 50% 88%/90% 40% no-repeat}
.near .puff{filter:blur(6px)}

/* ---------- shared buttons ---------- */
.btn{cursor:pointer;font-weight:700;font-size:16px;line-height:1.2;border-radius:999px;padding:10px 20px;border:1.5px solid transparent;transition:background .15s,border-color .15s}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn-sun{background:linear-gradient(#FFE07A,#FFC94D);color:#4A3200;border-color:#E0A82E;box-shadow:0 3px 0 var(--gold-deep)}
.btn-sun:active{box-shadow:0 1px 0 var(--gold-deep)}
.btn-glass{background:rgba(9,45,105,.24);border-color:rgba(255,255,255,.6);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn-glass:hover{background:rgba(9,45,105,.36)}
.btn-icon{width:44px;height:44px;padding:0;display:grid;place-items:center}
.btn-icon svg{width:20px;height:20px}
.btn-leaf{background:var(--leaf-deep);color:#fff;box-shadow:0 3px 0 var(--leaf-dark)}
.btn-leaf:hover{background:#33995F}
.btn-leaf:active{box-shadow:0 1px 0 var(--leaf-dark)}
.btn-star{background:linear-gradient(#FFE07A,#FFC94D);color:#4A3200;border-color:#E0A82E;box-shadow:0 3px 0 var(--gold-deep),0 0 18px rgba(255,201,77,.45)}
.btn-star:active{box-shadow:0 1px 0 var(--gold-deep)}
.btn-ghost{background:transparent;border-color:#9CC9A8;color:#1F5B3A}
.btn-ghost:hover{border-color:var(--leaf-deep);background:rgba(79,191,106,.08)}
.btn-quiet{background:none;border-color:transparent;color:var(--ink-soft);font-weight:500;text-decoration:underline;text-underline-offset:3px;padding-left:8px;padding-right:8px}
.btn-quiet:hover{color:var(--ink)}
.btn-danger{background:transparent;color:#9E2F4D;border-color:#E3A3B5}
.btn-danger:hover{border-color:#9E2F4D}
.btn-sm{font-size:15px;padding:6px 14px}
.mini{flex:none;cursor:pointer;background:rgba(79,191,106,.12);border:1px solid #A9CFA9;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:#1F5B3A;line-height:1.3}
.mini:hover{background:rgba(79,191,106,.22)}
.mini:disabled{opacity:.4;cursor:default}
.mini-danger{color:#9E2F4D;border-color:#E3A3B5;background:transparent}
.linklike{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-color:rgba(27,58,92,.35);text-underline-offset:3px}
.edge{display:flex;align-items:center;gap:8px;margin:0 auto;cursor:pointer;background:rgba(9,45,105,.22);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:999px;padding:7px 16px;font-size:15px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.edge:hover{background:rgba(9,45,105,.34)}
.edge svg{width:15px;height:15px}
.edge-dark{background:rgba(255,255,255,.55);border-color:rgba(27,58,92,.25);color:var(--ink)}
.edge-dark:hover{background:rgba(255,255,255,.8)}
.edge-top{margin-top:16px}
.edge-bottom{margin-bottom:34px}

/* ---------- firmament ---------- */
.z-firm{color:#DCE8FF}
.firm-canvas{position:relative}
.firm-canvas svg{display:block}
.firm-head{position:absolute;top:22px;left:26px;z-index:2;max-width:min(430px,68vw);pointer-events:none}
.firm-head h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:#fff;line-height:1.1}
.firm-head p{margin:6px 0 0;font-size:16px;color:#BFD2F5;font-style:italic;line-height:1.45}
.firm-down{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3}
.firm-down:active{transform:translateX(-50%) translateY(2px)}
.bgstar{fill:#fff}
.tw{animation:twinkle 4.5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.3}}
.thread{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.thread-glow{fill:none;stroke-width:6;opacity:.28;filter:url(#f-blur)}
.star{cursor:pointer;outline:none}
.star .pop{transform-box:fill-box;transform-origin:center}
.star:focus-visible .core{stroke:var(--gold);stroke-width:2.5}
.star:hover .core{stroke:#fff;stroke-width:3}
.star.new .pop{animation:starIn 1.1s 1.5s both}
@keyframes starIn{0%{transform:scale(0);opacity:0}55%{transform:scale(2);opacity:1}100%{transform:scale(1);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.6s 1.4s ease-out 3 both}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(4.5);opacity:0}}
.cat-label{font-family:var(--display);font-size:19px;text-anchor:middle}
.cat-count{font-size:14px;font-style:italic;text-anchor:middle;fill:#AFC4EC}
.tip{position:absolute;z-index:3;pointer-events:none;background:rgba(6,16,48,.9);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 12px;border-radius:9px;font-size:15px;line-height:1.3;width:max-content;max-width:230px;transform:translate(-50%,calc(-100% - 16px));opacity:0;transition:opacity .15s}
.tip.show{opacity:1}
.tip small{display:block;color:#A9BEE6;font-style:italic;font-size:13px;margin-top:2px}
.victory{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:4;width:min(450px,calc(100% - 28px));text-align:center;color:#fff;background:rgba(8,22,64,.84);border:1px solid rgba(255,214,107,.6);border-radius:20px;padding:22px 24px 16px;box-shadow:0 24px 60px -20px #000;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.victory[hidden]{display:none}
.victory.show{animation:rise .6s both}
@keyframes rise{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.victory h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;color:var(--gold);line-height:1.1}
.v-title{font-weight:700;font-size:20px;margin:6px 0 4px;line-height:1.3}
.v-gain{font-weight:800;font-size:22px;margin:0;color:#FFE58A}
.v-level{margin:4px 0 0;font-style:italic}
.v-claim{margin:12px 0 0;padding:9px 14px;border:1.5px dashed rgba(255,214,107,.7);border-radius:12px;background:rgba(255,201,77,.1)}
.v-claim span{display:block;font-size:14px;font-style:italic;color:#FFE9A8}
.v-claim strong{display:block;font-size:18px}
.v-note{margin:10px 0 0;font-size:15px;font-style:italic;color:#BFD2F5}
.v-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 12px;margin-top:14px}
.v-quiet{color:#CFE0FF}
.v-quiet:hover{color:#fff}

/* ---------- aether ---------- */
.aether-inner{min-height:100%;padding:0 clamp(16px,5vw,64px) 10px}
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:14px 24px;margin:14px 0 0;color:#fff}
.hud-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.world-name{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.6vw,52px);line-height:1.05;margin:0;text-shadow:0 2px 16px rgba(12,70,150,.45)}
.hud-stats{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:10px;padding:7px 15px;border-radius:18px;background:rgba(9,45,105,.28);border:1px solid rgba(255,255,255,.35);font-size:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud-stats em{font-style:italic}
.xp{display:inline-block;width:min(170px,40vw);height:9px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden}
.xp span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#FFC94D,#FFF0A8);transition:width .8s cubic-bezier(.3,.8,.3,1)}
.xp-note{font-size:15px;opacity:.92}
.hud-actions{display:flex;gap:10px;align-items:center;padding-top:8px}
.follow{display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;margin:0;padding:11px 18px 12px 14px;max-width:380px;border-radius:16px;background:rgba(9,45,105,.24);border:1px solid rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.follow:hover{background:rgba(9,45,105,.34)}
.f-wisp{flex:none;width:12px;height:12px;border-radius:50%;background:#FFF6C8;box-shadow:0 0 10px 4px rgba(255,230,140,.85);margin-top:8px}
.f-label{display:block;font-size:14px;font-style:italic;opacity:.92}
.f-title{display:block;font-weight:700;font-size:18px;line-height:1.3}
.f-next{display:block;font-size:15px;margin-top:2px}
.hint-note{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;max-width:560px;margin:14px 0 0;padding:9px 10px 9px 16px;border-radius:16px;background:rgba(255,255,255,.85);color:var(--ink);font-size:16px}
.hint-note p{margin:0;flex:1 1 260px}
.archipelago{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:64px 28px;margin:30px 0 10px;align-items:end}
.cluster{display:flex;flex-direction:column;align-items:center;min-width:0}
.cluster:nth-child(3n+2){padding-bottom:64px}
.cluster:nth-child(3n){padding-bottom:26px}
.islets{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:6px 14px;margin-bottom:6px;max-width:440px}
.isle{width:min(300px,88%);animation:bob 9s ease-in-out infinite;animation-delay:var(--bob,0s)}
.isle svg{display:block;width:100%;height:auto;overflow:visible}
.isle-name{font-family:var(--display);font-weight:400;font-size:25px;color:#fff;margin:-4px 0 0;text-shadow:0 2px 10px rgba(12,60,140,.55),0 0 2px rgba(12,60,140,.4);text-align:center;line-height:1.2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.islet{appearance:none;background:none;border:0;padding:4px 0 8px;cursor:pointer;width:132px;display:flex;justify-content:center}
.islet:nth-child(even){margin-top:24px}
.islet-inner{display:flex;flex-direction:column;align-items:center;animation:bob 6.5s ease-in-out infinite;animation-delay:var(--d,0s)}
.islet-art{position:relative;width:108px;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.islet:hover .islet-art{transform:translateY(-5px) scale(1.06)}
.islet-art svg{display:block;width:100%;height:auto;overflow:visible}
.sign{position:relative;margin-top:11px;background:linear-gradient(#F8ECCF,#EAD3A2);border:1px solid var(--wood-edge);border-radius:5px;padding:6px 10px;color:var(--wood-ink);font-size:15px;line-height:1.25;max-width:126px;box-shadow:0 3px 0 rgba(120,85,40,.35);text-align:center}
.sign::before,.sign::after{content:'';position:absolute;top:-13px;width:1.5px;height:13px;background:#8A6A44}
.sign::before{left:24%}
.sign::after{right:24%}
.sign-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.pips{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:5px}
.pip{width:7px;height:7px;transform:rotate(45deg);border-radius:1.5px;border:1.2px solid #7A9A55}
.pip.on{background:#5DAA4E;border-color:#4A8A3C}
.pip-text{display:block;font-size:13px;color:#6A5232;margin-top:3px;font-style:italic}
.islet.followed .sign{box-shadow:0 3px 0 rgba(120,85,40,.35),0 0 0 2px rgba(255,240,170,.95),0 0 20px rgba(255,230,140,.85)}
.orbit{position:absolute;inset:0;transform:scaleY(.42);pointer-events:none}
.wisp{position:absolute;top:50%;left:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#FFF6C8;box-shadow:0 0 9px 4px rgba(255,230,140,.9);animation:orbit 5.5s linear infinite}
@keyframes orbit{from{transform:rotate(0deg) translateX(54px)}to{transform:rotate(360deg) translateX(54px)}}
.islet-add{width:auto;min-width:80px;padding-top:30px}
.add-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.add-puff{width:62px;height:38px;border-radius:999px;background:rgba(9,45,105,.2);border:1.5px dashed rgba(255,255,255,.95);display:grid;place-items:center;color:#fff;font-size:24px;line-height:1;transition:background .15s}
.islet-add:hover .add-puff{background:rgba(9,45,105,.32)}
.add-label{color:#fff;font-style:italic;font-size:15px;text-shadow:0 1px 6px rgba(12,60,140,.6)}
.wind{position:relative;isolation:isolate;margin:70px auto 34px;max-width:900px;text-align:center;padding:40px 30px 44px;color:var(--ink)}
.wind::before{content:'';position:absolute;inset:-14px -40px;z-index:-1;filter:blur(1px);background:
  radial-gradient(closest-side,rgba(255,255,255,.8) 62%,rgba(255,255,255,0)) 6% 62%/34% 80% no-repeat,
  radial-gradient(closest-side,rgba(255,255,255,.8) 62%,rgba(255,255,255,0)) 30% 28%/38% 100% no-repeat,
  radial-gradient(closest-side,rgba(255,255,255,.8) 62%,rgba(255,255,255,0)) 62% 22%/40% 100% no-repeat,
  radial-gradient(closest-side,rgba(255,255,255,.8) 62%,rgba(255,255,255,0)) 92% 60%/32% 84% no-repeat,
  radial-gradient(closest-side,rgba(255,255,255,.8) 62%,rgba(255,255,255,0)) 50% 82%/88% 72% no-repeat}
.wind-h{font-family:var(--display);font-weight:400;font-size:27px;margin:0;color:#1F4A78}
.wind-sub{margin:2px auto 16px;font-style:italic;font-size:16px;max-width:48ch;color:#35587E}
.birds{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 16px}
.bird{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:#EEF8FF;color:var(--ink);border:1px solid #BFE0FB;border-radius:999px 999px 999px 6px;padding:7px 15px 7px 10px;font-style:italic;box-shadow:0 8px 18px -10px rgba(10,60,140,.55);animation:drift 8s ease-in-out infinite;animation-delay:var(--d,0s)}
.bird:hover{background:#fff}
.bird svg{width:24px;height:19px;flex:none}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-5px)}}
.bird-add{background:transparent;border:1.5px dashed #7FB3E0;font-style:normal;font-weight:700;color:#1F4A78;box-shadow:none;animation:none}

/* ---------- roots ---------- */
.z-roots{color:var(--ink)}
.roots-art{display:block;width:100%;height:clamp(200px,26vw,330px)}
.roots-body{position:relative;max-width:760px;margin:-20px auto 0;padding:0 clamp(18px,5vw,40px) 20px}
.roots-h{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.6vw,48px);margin:0;color:#24486E;line-height:1.1}
.roots-sub{margin:4px 0 16px;font-style:italic;color:var(--ink-soft)}
.tally{font-size:20px;margin:0 0 18px;max-width:52ch;line-height:1.5}
.recall{position:relative;background:rgba(255,255,255,.75);border:1px solid rgba(122,90,64,.22);border-radius:18px;padding:16px 20px 12px 60px;margin:0 0 26px;box-shadow:0 14px 30px -22px rgba(60,40,20,.6)}
.amber{position:absolute;left:20px;top:20px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2B8,#FFC94D 55%,#C98F1A);box-shadow:0 0 14px rgba(255,201,77,.85)}
.recall p{margin:0}
.r-line{font-size:19px}
.r-sub{font-style:italic;color:var(--ink-soft);font-size:16px;margin-top:2px}
.recall .btn-quiet{margin:4px 0 0 -8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 14px;border-radius:999px;border:1.5px solid rgba(27,58,92,.22);background:rgba(255,255,255,.6);cursor:pointer;font-size:15px}
.chip:hover{background:rgba(255,255,255,.9)}
.chip[aria-pressed="true"]{background:#24486E;color:#fff;border-color:#24486E}
.dot{display:inline-block;flex:none;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(27,58,92,.28)}
.taproot{position:relative;padding-bottom:10px}
.taproot::before{content:'';position:absolute;left:11px;top:4px;bottom:0;width:4px;border-radius:4px;background:linear-gradient(#8A6A4A,#6E5038 70%,rgba(110,80,56,0))}
.month h3{font-family:var(--display);font-weight:400;font-size:20px;color:#5C4330;margin:0 0 4px;padding-left:36px}
.deeds{list-style:none;margin:0 0 18px;padding:0}
.deed{display:grid;grid-template-columns:26px 1fr;gap:0 12px;width:100%;text-align:left;background:none;border:0;padding:8px 10px 8px 0;border-radius:12px;cursor:pointer}
.deed:hover{background:rgba(255,255,255,.6)}
.seed{grid-row:span 2;justify-self:center;margin-top:6px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF8DA,var(--c) 62%);box-shadow:0 0 0 3px rgba(255,255,255,.75),0 0 12px var(--c)}
.deed-title{font-weight:700;font-size:18px;line-height:1.3}
.deed-meta{font-size:15px;color:var(--ink-soft);font-style:italic}
.cloud-sea{position:relative;height:190px;margin-top:10px}
.cloud-sea .puff{bottom:-30px;height:170px}

/* ---------- rail ---------- */
.rail{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:6px;padding:7px;border-radius:999px;background:rgba(8,28,70,.34);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rail button{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:#fff;cursor:pointer}
.rail button:hover{background:rgba(255,255,255,.18)}
.rail button svg{width:20px;height:20px}
.rail button[aria-current="true"]{background:rgba(255,255,255,.94);color:#1B3A5C}

<script>
(() => {
'use strict';

/* ================= constants ================= */
const KEY = 'aether-quests-v2';
const DIFF = {
  breeze: { label: 'A breeze', xp: 15, r: 3 },
  climb:  { label: 'A climb',  xp: 30, r: 3.8 },
  storm:  { label: 'A storm',  xp: 60, r: 4.8 }
};
const PALETTE = ['#FFC94D','#6EC8FF','#6FD08C','#FF8FB1','#B79CFF','#FF9F6B','#5FE0D0','#E3EAF5'];
const PALETTE_NAMES = ['Sun','Sky','Leaf','Rose','Lilac','Coral','Mint','Pearl'];
const OBJ_XP = 5;
const RANKS = ['Wanderer','Wayfinder','Pathfinder','Skyrunner','Cloudwalker','Windrider','Stormcaller','Starsworn','Legend of the Aether'];
const GIVERS = ['future you','the island elders','a very persistent cloud','the wind spirits','a small but determined frog','the keeper of the lanterns','your past self, who meant well','a talking teapot','the guild of tidy corners','an old map with a coffee stain','the sky whales','a sleepy dragon who would like some quiet'];
const EPIC = [
  t => `The ${t} Expedition`, t => `Trial of the ${t}`, t => `The Great ${t} Ascent`,
  t => `Saga of the ${t}`, t => `The ${t} Pilgrimage`, t => `Legend of the ${t}`,
  t => `Into the ${t} Wilds`, t => `The Siege of ${t}`, t => `The ${t} Gambit`, t => `The Last ${t}`
];
const LEAD = new Set(['do','finish','start','clean','tidy','make','write','send','call','pay','answer','take','go','get','book','fix','sort','wash','put','buy','return','reply','to','the','a','an','my','some','that','this','those','these','up','out','away','deal','with','handle','file','submit','schedule','order','pick','drop','off','finally']);
const SMALL = new Set(['of','the','from','to','and','for','with','at','in','on','a','an','or','by']);
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const str = v => typeof v === 'string' ? v : '';
function hash(s){ let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
const fmtShort = ts => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtMonth = ts => new Date(ts).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
const levelOf = xp => Math.floor(xp / 100) + 1;
const rankOf = l => RANKS[Math.min(l - 1, RANKS.length - 1)];
const questXP = q => (DIFF[q.difficulty] || DIFF.climb).xp;
const getQ = id => state.quests.find(q => q.id === id);
const catById = id => state.categories.find(c => c.id === id);
const catOf = q => catById(q.categoryId) || state.categories[0];
const mkObjs = arr => arr.map(t => ({ id: uid(), text: t, done: false }));
function stageOf(n, total){ if (!total) return 1; const r = n / total; if (r === 0) return 0; if (r < .34) return 1; if (r < .67) return 2; if (r < 1) return 3; return 4; }
function ago(ts){
  const d = Math.floor((Date.now() - ts) / 86400000);
  if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 7) return `${d} days ago`;
  if (d < 30){ const w = Math.floor(d / 7); return w === 1 ? 'a week ago' : `${w} weeks ago`; }
  if (d < 365){ const m = Math.floor(d / 30); return m === 1 ? 'a month ago' : `${m} months ago`; }
  const y = Math.floor(d / 365); return y === 1 ? 'a year ago' : `${y} years ago`;
}
function coreWords(raw){
  let w = raw.trim().replace(/[.!?]+$/, '').split(/\s+/).filter(Boolean);
  const orig = w.slice();
  while (w.length > 1 && LEAD.has(w[0].toLowerCase())) w.shift();
  if (!w.length) w = orig;
  return w.map((x, i) => (i > 0 && SMALL.has(x.toLowerCase())) ? x.toLowerCase() : x.charAt(0).toUpperCase() + x.slice(1)).join(' ');
}

/* ================= state ================= */
let state = null;
let canSave = true;
const ui = {
  zone: 1, journal: null, draft: null, confirm: null, colorOpen: null, newCatOpen: false,
  formErr: '', settingsErr: '', importData: null, rootsFilter: 'all', recallId: null,
  pendingStar: null, victory: null, highlight: null, lastToggled: null, prevInto: null,
  epicLast: null, epicBase: '', vStage: null, animateSeg: false
};

function defaultCategories(){
  return [{ id: uid(), name: 'Main quests', color: '#FFC94D' }, { id: uid(), name: 'Side quests', color: '#6EC8FF' }];
}
function seed(){
  const [main, side] = defaultCategories();
  const now = Date.now();
  const q1 = { id: uid(), status: 'active', categoryId: side.id, difficulty: 'climb', created: now,
    title: 'The Siege of Mount Dishware', giver: 'the restless kitchen spirits',
    lore: 'The sink has fallen to an army of plates. Somewhere at the bottom, the good mugs await rescue.',
    objectives: mkObjs(['Clear one spot on the counter', 'Rescue the good mugs (wash them first)', 'Wash the rest of the hoard', 'Wipe down the battlefield']),
    reward: 'One episode of the good show' };
  const q2 = { id: uid(), status: 'active', categoryId: main.id, difficulty: 'storm', created: now + 1,
    title: 'The Scroll of Passage', giver: 'the border wardens',
    lore: 'Your scroll of passage grows old, and the wardens will soon refuse it. A new one must be forged before the next journey.',
    objectives: mkObjs(['Find the old passport', 'Get a new photo taken', 'Fill in the renewal form', 'Send it off']),
    reward: 'Plan one daydream trip' };
  const q3 = { id: uid(), status: 'rumor', categoryId: side.id, difficulty: 'breeze', created: now + 2,
    title: 'The Overdue Tome', giver: 'a stern letter from the library',
    lore: "A borrowed book has vanished somewhere in these halls. The library's patience is said to be finite.",
    objectives: mkObjs(['Check under the bed', 'Check the bag by the door', 'Drop it in the return slot']),
    reward: 'A browse through the new arrivals shelf' };
  return { version: 2, worldName: 'My Aether', xp: 0, followId: q1.id, categories: [main, side], quests: [q2, q1, q3], lastExport: null, seenHint: false, xpBy: {}, deleted: {}, pristine: true };
}

function normalize(d){
  if (!d || typeof d !== 'object' || !Array.isArray(d.categories) || !Array.isArray(d.quests)) return null;
  const cats = d.categories.filter(c => c && c.id && typeof c.name === 'string')
    .map((c, i) => ({ id: String(c.id), name: c.name.slice(0, 40) || 'Unnamed', color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : PALETTE[0],
      pos: (c.pos === 0 || +c.pos) ? +c.pos : i, updated: +c.updated || 0 }))
    .sort((a, b) => a.pos - b.pos);
  if (!cats.length) return null;
  const ids = new Set(cats.map(c => c.id));
  const quests = d.quests.filter(q => q && q.id && typeof q.title === 'string').map(q => {
    const status = ['active', 'rumor', 'done'].includes(q.status) ? q.status : 'active';
    return {
      id: String(q.id), title: q.title.slice(0, 120), status,
      categoryId: ids.has(q.categoryId) ? q.categoryId : cats[0].id,
      difficulty: DIFF[q.difficulty] ? q.difficulty : 'climb',
      giver: str(q.giver), lore: str(q.lore), reward: str(q.reward),
      objectives: Array.isArray(q.objectives) ? q.objectives.filter(o => o && typeof o.text === 'string').map(o => ({ id: String(o.id || uid()), text: o.text.slice(0, 140), done: !!o.done })) : [],
      created: +q.created || Date.now(),
      completed: status === 'done' ? (+q.completed || Date.now()) : undefined,
      updated: +q.updated || +q.completed || +q.created || 0,
      undo: (status === 'done' && q.undo && typeof q.undo === 'object') ? { open: Array.isArray(q.undo.open) ? q.undo.open.map(String) : [], xp: +q.undo.xp || 0, follow: !!q.undo.follow } : undefined
    };
  });
  const xpBy = {}, deleted = {};
  if (d.xpBy && typeof d.xpBy === 'object') for (const [k, e] of Object.entries(d.xpBy)) if (e && isFinite(+e.v)) xpBy[String(k)] = { v: +e.v, t: +e.t || 0 };
  if (d.deleted && typeof d.deleted === 'object') for (const [k, t] of Object.entries(d.deleted)) if (isFinite(+t)) deleted[String(k)] = +t;
  return {
    version: 2, worldName: str(d.worldName).slice(0, 40) || 'My Aether', nameAt: +d.nameAt || 0,
    xp: Object.keys(xpBy).length ? Math.max(0, Math.round(Object.values(xpBy).reduce((a, e) => a + e.v, 0))) : Math.max(0, Math.floor(+d.xp || 0)), xpBy,
    followId: quests.some(q => q.id === d.followId && q.status === 'active') ? d.followId : null, followAt: +d.followAt || 0,
    categories: cats, quests, deleted, lastExport: +d.lastExport || null, seenHint: !!d.seenHint, pristine: !!d.pristine
  };
}

/* ================= storage ================= */
function storageTest(){ try { localStorage.setItem('__aether_t', '1'); localStorage.removeItem('__aether_t'); return true; } catch (e) { return false; } }
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const d = normalize(JSON.parse(raw));
    if (!d) { localStorage.setItem(KEY + '-unreadable', raw); }
    return d;
  } catch (e) { return null; }
}
let saveTimer = null, warned = false, snap = new Map(), lastXp = 0, lastFollow = null, lastName = null, pendingSave = null;
const qSig = q => JSON.stringify([q.title, q.status, q.categoryId, q.difficulty, q.giver, q.lore, q.reward, q.objectives, q.created, q.completed || null]);
const cSig = c => JSON.stringify([c.name, c.color, c.pos]);
function takeSnap(){
  snap = new Map();
  state.quests.forEach(q => snap.set(q.id, qSig(q)));
  state.categories.forEach(c => snap.set('cat:' + c.id, cSig(c)));
  lastXp = state.xp; lastFollow = state.followId; lastName = state.worldName;
}
/* notice what changed since the last save, and stamp it with the time (this is what lets two devices merge) */
function stamp(){
  const now = Date.now(), seen = new Set(); let changed = false;
  state.xpBy = state.xpBy || {}; state.deleted = state.deleted || {};
  state.categories.forEach((c, i) => { if (c.pos !== i) c.pos = i; });
  state.quests.forEach(q => { seen.add(q.id); if (snap.get(q.id) !== qSig(q)){ q.updated = now; changed = true; } });
  state.categories.forEach(c => { const k = 'cat:' + c.id; seen.add(k); if (snap.get(k) !== cSig(c)){ c.updated = now; changed = true; } });
  for (const k of snap.keys()) if (!seen.has(k)){ state.deleted[k] = now; changed = true; }
  if (state.xp !== lastXp){ const e = state.xpBy[DEVICE] || { v: 0 }; state.xpBy[DEVICE] = { v: (+e.v || 0) + (state.xp - lastXp), t: now }; changed = true; }
  if (state.followId !== lastFollow){ state.followAt = now; changed = true; }
  if (state.worldName !== lastName){ state.nameAt = now; changed = true; }
  takeSnap();
  return changed;
}
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); canSave = true; }
  catch (e) {
    canSave = false;
    if (!warned){ warned = true; toast('This browser blocked saving. Export a backup in Settings before you close the page.'); }
  }
}
function doPersist(quiet){
  pendingSave = null;
  const changed = stamp();
  if (changed) state.pristine = false;
  saveLocal();
  if (changed && !quiet) schedulePush();
}
function persist(opts){
  const quiet = !!(opts && opts.quiet);
  clearTimeout(saveTimer); pendingSave = { quiet };
  saveTimer = setTimeout(() => doPersist(quiet), 200);
}
function flushPersist(){ if (pendingSave){ clearTimeout(saveTimer); doPersist(pendingSave.quiet); } }

/* ================= sync with GitHub ================= */
const SYNC_KEY = 'aether-sync', GIST_FILE = 'aether-quests.json', GIST_DESC = 'Aether Quests sync (made by the Aether Quests app)';
let DEVICE = 'device', sync = {}, syncing = false, syncQueued = false, pushT = null, syncState = 'ok';
function deviceId(){ try { let d = localStorage.getItem('aether-device'); if (!d){ d = uid(); localStorage.setItem('aether-device', d); } return d; } catch (e) { return 'device'; } }
function loadSync(){ try { sync = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}') || {}; } catch (e) { sync = {}; } }
function saveSync(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {} }
const xpTotal = by => Math.max(0, Math.round(Object.values(by || {}).reduce((a, e) => a + (+e.v || 0), 0)));
function initLedger(){
  state.xpBy = state.xpBy || {}; state.deleted = state.deleted || {};
  state.categories.forEach((c, i) => { c.pos = i; });
  if (!Object.keys(state.xpBy).length && state.xp) state.xpBy[DEVICE] = { v: state.xp, t: Date.now() };
  if (Object.keys(state.xpBy).length) state.xp = xpTotal(state.xpBy);
}
function agoShort(ts){
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 45) return 'just now';
  const m = Math.round(s / 60); if (m < 60) return m === 1 ? 'a minute ago' : m + ' minutes ago';
  const h = Math.round(m / 60); if (h < 24) return h === 1 ? 'an hour ago' : h + ' hours ago';
  return 'on ' + fmtDate(ts);
}

/* what goes into the gist: a fixed shape, so two copies of the same data compare equal */
const canonQuest = q => ({ id: q.id, title: q.title, status: q.status, categoryId: q.categoryId, difficulty: q.difficulty, giver: q.giver || '', lore: q.lore || '', reward: q.reward || '',
  objectives: (q.objectives || []).map(o => ({ id: o.id, text: o.text, done: !!o.done })), created: q.created || 0, completed: q.completed || null, updated: q.updated || 0, undo: q.undo || null });
function forRemote(s){
  return { version: 2, worldName: s.worldName, nameAt: s.nameAt || 0, followId: s.followId || null, followAt: s.followAt || 0, xpBy: s.xpBy || {}, seenHint: !!s.seenHint,
    categories: s.categories.map(c => ({ id: c.id, name: c.name, color: c.color, pos: c.pos || 0, updated: c.updated || 0 })),
    quests: s.quests.map(canonQuest), deleted: s.deleted || {} };
}

/* combine two copies: newest version of each quest/category wins, deletions are remembered, XP adds up per device */
function mergeStates(L, R){
  const now = Date.now(), del = Object.assign({}, R.deleted || {});
  for (const [k, t] of Object.entries(L.deleted || {})) if (!(k in del) || del[k] < t) del[k] = t;
  const pick = (a, b) => !a ? b : (!b ? a : ((b.updated || 0) > (a.updated || 0) ? b : a));
  const both = (la, ra, pre) => {
    const m = new Map();
    la.forEach(x => m.set(x.id, x));

/* GitHub API */
async function gh(path, opts){
  opts = opts || {};
  const headers = { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + sync.token };
  if (opts.body) headers['Content-Type'] = 'application/json';
  let res;
  try { res = await fetch('https://api.github.com' + path, { method: opts.method || 'GET', headers, body: opts.body, cache: 'no-store' }); }
  catch (e) { const er = new Error('offline'); er.offline = true; throw er; }
  if (!res.ok){ const er = new Error('GitHub ' + res.status); er.status = res.status; throw er; }
  return res.status === 204 ? null : res.json();
}
async function findGist(){
  for (let page = 1; page <= 5; page++){
    const list = await gh(`/gists?per_page=100&page=${page}`);
    const hit = (list || []).find(g => g.files && g.files[GIST_FILE]);
    if (hit) return hit.id;
    if (!list || list.length < 100) break;
  }
  return null;
}
async function readGist(id){
  const g = await gh('/gists/' + id), f = g && g.files && g.files[GIST_FILE];
  if (!f) return null;
  if (f.truncated && f.raw_url){ const r = await fetch(f.raw_url, { cache: 'no-store' }); return r.text(); }
  return f.content;
}

async function createGist(content){
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: GIST_DESC, public: false, files: { [GIST_FILE]: { content } } }) });

/* one round: read the gist, merge, save locally, write the merged copy back if it changed */
async function syncNow(reason){
  if (!sync.token) return;
  if (syncing){ syncQueued = true; return; }
  syncing = true;
  const loud = reason !== 'tick' && reason !== 'visible';
  if (loud) setSyncPill('syncing');
  try {
    flushPersist();
    if (!sync.gistId){ sync.gistId = await findGist(); saveSync(); }
    let remote = null;
    if (sync.gistId){
      let text = null;
      try { text = await readGist(sync.gistId); }
      catch (e) { if (e.status === 404){ sync.gistId = await findGist(); saveSync(); } else throw e; }
      if (text){ try { remote = normalize(JSON.parse(text)); } catch (e) { remote = null; } }
    }
    if (remote){
      const before = JSON.stringify(forRemote(state));
      state = state.pristine ? adoptRemote(remote) : mergeStates(state, remote);
      initLedger(); takeSnap(); saveLocal();
      if (JSON.stringify(forRemote(state)) !== before) renderAll();
    }
    const out = JSON.stringify(forRemote(state));
    if (!sync.gistId){ sync.gistId = await createGist(out); }
    else if (!remote || JSON.stringify(forRemote(remote)) !== out) await writeGist(sync.gistId, out);
    sync.lastSync = Date.now(); sync.lastError = null; saveSync(); setSyncPill('ok');

    sync.lastError = e.offline ? "You're offline right now. Your changes are saved here and will sync when you're back online."

      : (e.status === 403 || e.status === 404 || e.status === 422) ? "This token can't save gists. Make a new token with the gist box ticked, then disconnect and connect again."
      : e.status === 429 ? 'GitHub asked to slow down for a bit. It will try again soon.'
      : 'Sync hit a snag. It will try again in a minute.';
    saveSync(); setSyncPill('err');
  } finally {
    syncing = false;
    if (ui.journal && ui.journal.type === 'settings') renderJournal();
    if (syncQueued){ syncQueued = false; setTimeout(() => syncNow('queued'), 400); }

}

/* the clock: the device's own time by default, or a chosen time zone; a time of day can also be pinned for previewing */
const SKY_KEY = 'aether-sky';
let skyCfg = {};
function loadSky(){ try { skyCfg = JSON.parse(localStorage.getItem(SKY_KEY) || '{}') || {}; } catch (e) { skyCfg = {}; } }
function saveSky(){ try { localStorage.setItem(SKY_KEY, JSON.stringify(skyCfg)); } catch (e) {} }
const deviceTZ = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } };
function hourIn(tz){
  const d = new Date();
  if (!tz) return d.getHours() + d.getMinutes() / 60;
  try {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(d);
    const h = +(parts.find(p => p.type === 'hour') || {}).value, m = +(parts.find(p => p.type === 'minute') || {}).value;
    return (isFinite(h) ? h % 24 : d.getHours()) + (isFinite(m) ? m / 60 : 0);
  } catch (e) { return d.getHours() + d.getMinutes() / 60; }
}
const PHASE_HOURS = { dawn: '5–7am', morning: '7–11am', noon: '11am–2pm', afternoon: '2–5:30pm', sunset: '5:30–7pm', evening: '7–8:30pm', night: '8:30pm–midnight and 3–5am', midnight: 'midnight–3am' };
function phaseAt(h){
  if (h >= 5 && h < 7) return 'dawn';
  if (h >= 7 && h < 11) return 'morning';
  if (h >= 11 && h < 14) return 'noon';
  if (h >= 14 && h < 17.5) return 'afternoon';
  if (h >= 17.5 && h < 19) return 'sunset';
  if (h >= 19 && h < 20.5) return 'evening';
  if (h < 3) return 'midnight';
  return 'night';
}
const livePhase = () => phaseAt(hourIn(skyCfg.tz || ''));
const wantedPhase = () => (skyCfg.lock && PHASES[skyCfg.lock]) ? skyCfg.lock : livePhase();
let phaseName = 'afternoon', PH = PHASES.afternoon;
function skyLayer(){
  const t = THEME.base, s = PH.sky, d = PH.depths;
  return `linear-gradient(180deg,${t[0]} 0%,${t[1]} 10%,${t[2]} 20%,${rgba(mixC(hexRGB(t[3]), hexRGB(s[0]), .6))} 29%,${s[0]} 33.4%,${s[1]} 42%,${s[2]} 50%,${s[3]} 56%,${s[4]} 62%,${s[5]} 66.6%,${d[0]} 66.7%,${d[1]} 75%,${d[2]} 83%,${d[3]} 91%,${d[4]} 100%)`;
}
function setPhaseVars(){
  document.body.dataset.phase = phaseName;
  document.body.classList.toggle('phase-dark', !!PH.dark);
  const st = document.documentElement.style;
  st.setProperty('--seam', rgba(PH.ceil.seam)); st.setProperty('--seam-a', rgba(PH.ceil.seam, .92));
  st.setProperty('--cloud-body', rgba(mixC(PH.cloud.lit, PH.cloud.mid, .55)));
  $('L-sky').style.background = skyLayer();
}
function applyPhase(name){
  if (!PHASES[name]) name = 'afternoon';
  const prev = phaseName;
  if (name !== prev && THEMES.length > 1){ let t; do { t = THEMES[Math.floor(Math.random() * THEMES.length)]; } while (t === THEME); THEME = t; }
  phaseName = name; PH = PHASES[name];
  for (const k of [...paintCache.keys()]){ const ph = k.slice(k.lastIndexOf('|') + 1); if (ph !== name && ph !== prev){ const v = paintCache.get(k); if (v && v.close) v.close(); paintCache.delete(k); } }
  setPhaseVars();
  try { makeCloudSprites(); } catch (e) { console.error(e); }
  bgSize[0] = {}; bgSize[1] = {}; bgSize[2] = {};
  paintZoneBackdrop(1); setTimeout(() => paintZoneBackdrop(2), 60); setTimeout(() => paintZoneBackdrop(0), 120);
  renderAll();
}
function checkPhase(){ const n = wantedPhase(); if (n !== phaseName) applyPhase(n); }

/* fireflies drifting around each island after dark */
function firefliesHTML(seed){
  const n = PH.fireflies || 0; if (!n || reduced) return '';
  const r = rng(seed + 77); let h = '<div class="fireflies" aria-hidden="true">';
  for (let i = 0; i < n; i++){
    h += `<span style="left:${(6 + r() * 88).toFixed(1)}%;top:${(18 + r() * 70).toFixed(1)}%;--fx:${((r() - .5) * 44).toFixed(0)}px;--fy:${((r() - .5) * 36).toFixed(0)}px;animation-duration:${(4 + r() * 5).toFixed(1)}s,${(1.6 + r() * 2.4).toFixed(1)}s;animation-delay:-${(r() * 6).toFixed(1)}s,-${(r() * 3).toFixed(1)}s"></span>`;

}

const tzLabel = z => TZ_FRIENDLY[z] || z.replace(/_/g, ' ').replace(/\//g, ' / ');
function skySection(){
  const dtz = deviceTZ(), cur = skyCfg.tz || '', lock = skyCfg.lock || '';
  let all = [];

  const common = Object.keys(TZ_FRIENDLY), rest = (all.length ? all : ['Europe/London', 'Europe/Paris', 'Asia/Tokyo', 'Australia/Sydney']).filter(z => !TZ_FRIENDLY[z]);
  const opt = z => `<option value="${esc(z)}"${z === cur ? ' selected' : ''}>${esc(tzLabel(z))}</option>`;

strong>${PHASE_LABEL[livePhase()].toLowerCase()}<\/strong> (${PHASE_HOURS[livePhase()]}) by ${cur ? esc(tzLabel(cur)) : \"this device's clock\"}${lock ? `, but the sky is pinned to <strong>${PHASE_LABEL[lock].toLowerCase()}<\/strong>` : ''}.<\/p>\n    <div class=\"f-block\"><label class=\"f-label\" for=\"s-tz\">Time zone<\/label>\n      <select class=\"ink-in sky-select\" id=\"s-tz\"><option value=\"\">This device's clock${dtz ? ' (' + esc(tzLabel(dtz)) + ')' : ''}<\/option>\n        <optgroup label=\"Common\">${common.map(opt).join('')}<\/optgroup><optgroup label=\"Everywhere else\">${rest.map(opt).join('')}<\/optgroup><\/select><\/div>\n    <fieldset><legend>Show the sky at<\/legend><div class=\"seg\">${chip('', 'The current time')}${PHASE_ORDER.map(p => chip(p, PHASE_LABEL[p])).join('')}<\/div>\n      <span class=\"f-hint\" style=\"margin-top:8px\">Pick a time of day to preview it, or to keep it that way. \"The current time\" follows the clock again.<\/span>\n      <span class=\"f-hint\" style=\"margin-top:6px\">${PHASE_ORDER.map(p => `${PHASE_LABEL[p]} ${PHASE_HOURS[p]}`).join(' \u00b7 ')}<\/span><\/fieldset><\/div>`;\n}\n\n/* ---- the painter thread: paints on request and hands finished pictures back to the page ---- */\nonmessage = e => {\n  const m = e.data;\n  try {\n    if (m.theme != null && THEMES[m.theme]) THEME = THEMES[m.theme];\n    if (m.phase && PHASES[m.phase]){ phaseName = m.phase; PH = PHASES[m.phase]; }\n    if (m.t === 'key'){\n      const c = paintKey(m.key), bmp = c.transferToImageBitmap();\n      postMessage({ t: 'key', key: m.key, bmp }, [bmp]);\n    } else if (m.t === 'bg'){\n      const [c, x] = mkCanvas(m.W, m.H, m.S);\n      BACKDROPS[m.i].paint(x, m.W, m.H, m.S);\n      const bmp = c.transferToImageBitmap();\n      postMessage({ t: 'bg', i: m.i, job: m.job, W: m.W, H: m.H, S: m.S, bmp }, [bmp]);\n    } else if (m.t === 'sprites'){\n      const list = cloudSpriteCanvases();\n      Promise.all(list.map(([n, c]) => c.convertToBlob({ type: function renderFirmament(){
  syncFirmSaying();
  const sc = $('scroll-0'), cv = $('firm-canvas');
  const cats = state.categories, n = cats.length;
  const Wv = sc.clientWidth || innerWidth, Hv = sc.clientHeight || innerHeight;
  const gutter = innerWidth <= 720 ? 52 : 0, rg = rowGeom(), W = rg ? rowWidth(rg, Wv) : Math.max(Wv, n * 112 + gutter), colW = rg ? rg.colW + 28 : (W - gutter) / n;

    done: state.quests.filter(q => q.status === 'done' && q.categoryId === c.id).sort((a, b) => a.completed - b.completed),
    ahead: state.quests.filter(q => q.status !== 'done' && q.categoryId === c.id).sort((a, b) => ((a.status === b.status) ? 0 : (a.status === 'active' ? -1 : 1)) || a.created - b.created)
  }));

    const x = r0() * W, y = r0() * H, s = r0(), o = (.15 + r0() * .45) * .6, tw = s > .9;
    bg += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${(s < .85 ? .5 + s * .7 : 1.3 + s * .6).toFixed(2)}" class="bgstar${tw ? ' tw' : ''}" style="opacity:${o.toFixed(2)}${tw ? ';animation-delay:-' + (r0() * 4).toFixed(1) + 's' : ''}"/>`;
  }
  let threads = '', stars = '', labels = '';
  cols.forEach(k => {
    const cx = rg ? rg.padL + rg.centers[k.i] : colW * (k.i + .5), col = k.c.color, spread = Math.min(colW * .5, 130);
    const pts = k.done.map((q, m) => { const rr = rng(hash(q.id)); return { q, x: cx + (rr() - .5) * spread, y: H - BASE - m * SP - (rr() - .5) * 30 }; });

    const settled = pending ? pts.slice(0, -1) : pts;
    if (settled.length > 1){
      const d = 'M' + settled.map(p => f1(p.x) + ',' + f1(p.y)).join(' L');
      threads += `<path d="${d}" class="thread-glow" stroke="${col}"/><path d="${d}" class="thread" stroke="${col}"/>`;
    }
    if (pending && pts.length > 1){

    }

      const sparkle = p.q.difficulty === 'storm' ? `<path d="M0,${f1(-R*3.6)} L${f1(R*.5)},${f1(-R*.5)} L${f1(R*3.6)},0 L${f1(R*.5)},${f1(R*.5)} L0,${f1(R*3.6)} L${f1(-R*.5)},${f1(R*.5)} L${f1(-R*3.6)},0 L${f1(-R*.5)},${f1(-R*.5)} Z" fill="#fff" opacity=".85"/>` : '';
      stars += `<g class="star${isNew ? ' new' : ''}" transform="translate(${f1(p.x)},${f1(p.y)})" data-action="open" data-id="${p.q.id}" data-x="${f1(p.x)}" data-y="${f1(p.y)}" tabindex="0" role="button" aria-label="${esc(p.q.title)}, finished ${esc(fmtDate(p.q.completed))}" data-tip="${esc(p.q.title)}" data-sub="Finished ${esc(fmtShort(p.q.completed))}">
        <g class="pop"><circle class="halo" style="--pd:-${((hash(p.q.id) % 50) / 10).toFixed(1)}s" r="${f1(R*5)}" fill="${col}" opacity=".45" filter="url(#f-blur)"/><g class="beat" style="--pd:-${((hash(p.q.id) % 50) / 10).toFixed(1)}s">${sparkle || `<path d="M0,${f1(-R*3.4)} V${f1(R*3.4)} M${f1(-R*3.4)},0 H${f1(R*3.4)}" stroke="#fff" stroke-opacity=".6" stroke-width=".8"/>`}<circle class="core" r="${R}" fill="#fff"/></g>${hl ? `<circle class="ring" r="8" fill="none" stroke="${col}" stroke-width="1.6"/>` : ''}</g>

function questBody(q){
  const d = DIFF[q.difficulty] || DIFF.climb;
  const done = q.status === 'done', rumor = q.status === 'rumor', active = q.status === 'active';
  const total = q.objectives.length, n = q.objectives.filter(o => o.done).length;
  const stage = done ? 4 : stageOf(n, total);
  const grew = ui.vStage && ui.vStage.id === q.id && stage > ui.vStage.stage;
  ui.vStage = { id: q.id, stage };
  const nextIdx = q.objectives.findIndex(o => !o.done);
  const allDone = total > 0 && nextIdx === -1;
  const followed = state.followId === q.id;
  let h = `<div class="vignette${done ? ' night' : ''}${grew ? ' grew' : ''}" aria-hidden="true">${done ? '<span class="v-star"></span>' : ''}${paintSlot('S', hash(q.id), stage)}</div>`;
  if (done) h += `<p class="done-line">Finished ${esc(fmtDate(q.completed))}</p>`;
  h += `<p class="j-meta">${rumor ? 'A rumor on the wind. ' : ''}Feels like ${esc(d.label.toLowerCase())}</p>
    <h2 class="j-title" id="j-title">${esc(q.title)}</h2>
    ${q.giver ? `<p class="j-giver">Given by ${esc(q.giver)}</p>` : '<div style="height:14px"></div>'}
    ${q.lore ? `<p class="j-lore">${esc(q.lore)}</p>` : ''}`;
  if (total || !done){
    h += `<div class="j-section"><h3 class="j-h">Objectives</h3>`;
    if (total){
      h += `<ul class="steps">${q.objectives.map((o, i) => `<li><button class="step${active && i === nextIdx ? ' next' : ''}${ui.lastToggled === o.id && o.done ? ' pop' : ''}" role="checkbox" aria-checked="${o.done}" data-action="toggle" data-id="${o.id}"${active ? '' : ' disabled'}>
        <span class="bud" aria-hidden="true">${BUD_CLOSED}${BUD_OPEN}</span><span class="step-text">${esc(o.text)}</span>${ui.lastToggled === o.id && o.done ? `<span class="xp-pop" aria-hidden="true">+${OBJ_XP} XP</span>` : ''}</button></li>`).join('')}</ul>`;
    } else h += `<p class="j-empty">No objectives yet. Add the first small step.</p>`;
    if (rumor && total) h += `<p class="j-empty">Take this quest on to start checking these off.</p>`;
    if (!done) h += `<div class="add-step"><input class="ink-in" id="add-step" placeholder="Add a step" aria-label="New objective" autocomplete="off" maxlength="140"><button class="mini" data-action="add-step">Add</button></div>`;
    h += `</div>`;
  }
  h += `<div class="j-section"><h3 class="j-h">Reward</h3><p class="j-reward">${ICON.fruit}<span>${q.reward ? esc(q.reward) : '<span class="j-soft">Glory, mostly</span>'}</span><span class="j-xp">+${d.xp} XP</span></p></div>`;
  if (active && allDone && ui.confirm !== 'del') h += `<p class="turn-in">Every objective is done. Time to turn it in.</p>`;
  h += `<div class="j-actions">`;
  const confirm = (msg, yes) => `<p class="confirm-q">${msg}</p><button class="btn btn-danger confirm-yes" data-action="del-yes">${yes}</button><button class="btn btn-ghost" data-action="confirm-no">Keep it</button>`;
  if (active){
    h += ui.confirm === 'del' ? confirm("Abandon this quest? It'll be erased from your aether. No penalty.", 'Yes, abandon it')
      : `<button class="btn btn-star" data-action="complete">Complete quest</button>
         <button class="btn btn-ghost" data-action="follow" aria-pressed="${followed}">${followed ? 'Stop following' : 'Follow quest'}</button>
         <button class="btn btn-ghost" data-action="edit">Edit</button>
         <button class="btn btn-quiet" data-action="ask-del">Abandon quest</button>`;
  } else if (rumor){
    h += ui.confirm === 'del' ? confirm('Let this rumor go? It will be erased.', 'Yes, let it go')
      : `<button class="btn btn-leaf" data-action="accept">Take it on</button>
         <button class="btn btn-ghost" data-action="edit">Edit</button>
         <button class="btn btn-quiet" data-action="ask-del">Let it drift away</button>`;
  } else {
    h += ui.confirm === 'del' ? confirm('Remove this quest from your roots and the firmament? Your XP stays.', 'Yes, remove it')
      : `<button class="btn btn-leaf" data-action="see-star">See its star</button>
         <button class="btn btn-ghost" data-action="again">Take on again</button>
         <button class="btn btn-ghost" data-action="uncomplete">Mark as not done</button>
         <button class="btn btn-quiet" data-action="ask-del">Remove</button>`;
  }
  return h + `</div>`;
}

/* ================= navigation ================= */
const scrollers = [$('scroll-0'), $('scroll-1'), $('scroll-2')];
/* flying through the cloud sea between the aether and the roots */
let movingT = null;
function moving(){ document.body.classList.add('moving'); clearTimeout(movingT); movingT = setTimeout(() => document.body.classList.remove('moving'), 1650); }

/* areas you can't see don't need to keep animating */
function wakeZone(z){ const el = $('zone-' + z); if (el) el.classList.remove('asleep'); if (z === 1 && !document.hidden) flowPause(false); }
function sleepZones(){
  for (let i = 0; i < 3; i++){ const el = $('zone-' + i); if (el) el.classList.toggle('asleep', i !== ui.zone); }
  flowPause(ui.zone !== 1 || document.hidden);
}
document.addEventListener('visibilitychange', () => flowPause(document.hidden || ui.zone !== 1));

function applyCamera(instant){
  const vh = window.innerHeight;
  if (instant) document.body.classList.add('no-anim');
  const t = f => `translate3d(0,${(-ui.zone * vh * f).toFixed(1)}px,0)`;
  $('world').style.transform = t(1); $('L-sky').style.transform = t(1);
  $('L-far').style.transform = t(.6); $('L-near').style.transform = t(1.3);
  if (instant){ void document.body.offsetWidth; requestAnimationFrame(() => document.body.classList.remove('no-anim')); }
}
function setInert(){
  const open = !!ui.journal;
  [0, 1, 2].forEach(i => { $('zone-' + i).inert = open || i !== ui.zone; });
  $('rail').inert = open;
}
const edge = [{}, {}, {}];
function updateEdge(i){
  const sc = scrollers[i], now = Date.now(), s = edge[i];
  const atTop = sc.scrollTop <= 1, atBot = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2;
  s.top = atTop ? (s.top || now) : null; s.bot = atBot ? (s.bot || now) : null;
}
let navLock = 0;
function go(z, opts){
  opts = opts || {};
  z = Math.max(0, Math.min(2, z));
  if (ui.journal) closeJournal();
  if (z === 0 && !opts.keepScroll){ const sc = scrollers[0]; sc.scrollTop = sc.scrollHeight; }
  if (ui.zone === 0 && z !== 0) hideVictory();
  hideTip(); applySlide();
  if (z === ui.zone){ applyCamera(); return; }
  moving(); rotateSayings(z, false); wakeZone(z);
  ui.zone = z; document.body.dataset.zone = z;
  navLock = Date.now() + 1600;
  edge[z] = {};
  applyCamera(); setInert(); renderRail();
  setTimeout(() => { updateEdge(z); sleepZones(); }, reduced ? 0 : 1550);
}
scrollers.forEach((sc, i) => sc.addEventListener('scroll', () => { updateEdge(i); if (i === 0) hideTip(); parallaxZone(i); }, { passive: true }));
let wheelAcc = 0, wheelAt = 0;
window.addEventListener('wheel', e => {
  if (ui.journal || Date.now() < navLock) return;
  const i = ui.zone, s = edge[i], now = Date.now();
  updateEdge(i);
  let dir = 0;
  if (e.deltaY < 0 && i > 0 && s.top && now - s.top > 450) dir = -1;
  else if (e.deltaY > 0 && i < 2 && s.bot && now - s.bot > 450) dir = 1;
  if (!dir){ wheelAcc = 0; return; }
  if (now - wheelAt > 400) wheelAcc = 0;
  wheelAt = now; wheelAcc += Math.abs(e.deltaY);
  if (wheelAcc > 240){ wheelAcc = 0; go(i + dir); }
}, { passive: true });
let touch = null;
window.addEventListener('touchstart', e => {
  if (ui.journal || e.touches.length !== 1) return;
  const sc = scrollers[ui.zone];
  touch = { y: e.touches[0].clientY, t: Date.now(), top: sc.scrollTop <= 1, bot: sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2 };
}, { passive: true });
window.addEventListener('touchend', e => {
  if (!touch || ui.journal) { touch = null; return; }
  const dy = e.changedTouches[0].clientY - touch.y;
  if (Date.now() - touch.t < 900 && Date.now() > navLock){
    if (dy > 110 && touch.top && ui.zone > 0) go(ui.zone - 1);
    else if (dy < -110 && touch.bot && ui.zone < 2) go(ui.zone + 1);
  }
  touch = null;
}, { passive: true });

function saveForm(){

  if (!title){ ui.formErr = 'Give your quest a name to save it.'; renderJournal(); $('f-title').focus(); return; }
  const lines = f.objText.split('\n').map(s => s.trim()).filter(Boolean).map(s => s.slice(0, 140));
  const fields = { title: title.slice(0, 120), giver: f.giver.trim(), lore: f.lore.trim(), reward: f.reward.trim(), categoryId: catById(f.categoryId) ? f.categoryId : state.categories[0].id, difficulty: DIFF[f.difficulty] ? f.difficulty : 'climb' };
  let q;
  if (ui.journal.type === 'edit'){
    q = getQ(ui.journal.id);
    const used = new Set();
    q.objectives = lines.map(t => { const m = q.objectives.find(o => o.text === t && !used.has(o.id)); if (m){ used.add(m.id); return m; } return { id: uid(), text: t, done: false }; });
    Object.assign(q, fields);
    toast('Quest updated');
  } else {
    q = Object.assign({ id: uid(), status: f.dest, created: Date.now(), objectives: mkObjs(lines) }, fields);
    state.quests.push(q);
    if (q.status === 'active' && !state.quests.some(x => x.id === state.followId && x.status === 'active')) state.followId = q.id;
    toast(q.status === 'active' ? 'New quest: ' + q.title : 'Rumor noted');
  }
  persist();
  ui.draft = null; ui.journal = { type: 'quest', id: q.id }; ui.vStage = null;
  renderAll(); $('journal').scrollTop = 0;
}
function completeQuest(){
  const q = currentQ(); if (!q) return;
  const levelBefore = levelOf(state.xp), gained = questXP(q);
  q.undo = { open: q.objectives.filter(o => !o.done).map(o => o.id), xp: gained, follow: state.followId === q.id };
  q.objectives.forEach(o => { o.done = true; });
  q.status = 'done'; q.completed = Date.now();
  state.xp += gained;
  if (state.followId === q.id) state.followId = null;
  persist();
  hideVictory();
  ui.pendingStar = q.id; ui.victory = { id: q.id, gained, levelBefore }; ui.animateSeg = true; ui.recallId = q.id;
  closeJournal();
  scrollFirmTo(q.id);
  go(0, { keepScroll: true });
  vTimer = setTimeout(showVictory, reduced ? 50 : 2500);
}
function uncompleteQuest(q){
  if (!q || q.status !== 'done') return;
  const u = q.undo || {}, open = new Set(u.open || []);
  q.objectives.forEach(o => { if (open.has(o.id)) o.done = false; });
  q.status = 'active'; q.completed = undefined; delete q.undo;
  state.xp = Math.max(0, state.xp - (u.xp != null ? u.xp : questXP(q)));
  if (u.follow && !state.quests.some(x => x.id === state.followId && x.status === 'active')) state.followId = q.id;
  if (ui.recallId === q.id) ui.recallId = null;
  persist();
}

function exportBackup(){
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  state.lastExport = Date.now();
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `aether-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  persist(); toast('Backup exported'); renderJournal();
}
function handleImport(file){
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    let d = null; try { d = normalize(JSON.parse(fr.result)); } catch (e) { d = null; }
    if (!d){ ui.settingsErr = "That file isn't an aether backup. Choose a .json file made with Export a backup."; ui.importData = null; }
    else { ui.settingsErr = ''; ui.importData = d; }
    renderJournal();
  };
  fr.onerror = () => { ui.settingsErr = "That file couldn't be read. Try choosing it again."; renderJournal(); };
  fr.readAsText(file);
}

const A = {
  open: el => openJournal({ type: 'quest', id: el.dataset.id }, el),
  new: el => openJournal({ type: 'new', cat: el.dataset.cat, dest: el.dataset.dest }, el),
  settings: el => openJournal({ type: 'settings' }, el),
  'close-journal': () => closeJournal(),
  'dismiss-hint': () => { state.seenHint = true; persist(); renderAether(); },
  toggle: el => {
    const q = currentQ(); if (!q || q.status !== 'active') return;
    const o = q.objectives.find(x => x.id === el.dataset.id); if (!o) return;
    o.done = !o.done; state.xp = Math.max(0, state.xp + (o.done ? OBJ_XP : -OBJ_XP));
    ui.lastToggled = o.id; persist(); renderJournal(); renderAether();
  },
  'add-step': () => addStep(),
  follow: () => {
    const q = currentQ(); if (!q) return;
    state.followId = state.followId === q.id ? null : q.id; persist();
    toast(state.followId ? 'Following this quest' : 'Stopped following'); renderJournal(); renderAether();
  },
  complete: () => completeQuest(),
  accept: () => {
    const q = currentQ(); if (!q) return;
    q.status = 'active';
    if (!state.quests.some(x => x.id === state.followId && x.status === 'active')) state.followId = q.id;
    persist(); toast('Quest accepted: ' + q.title); renderJournal(); renderAether(); renderFirmament();
  },
  edit: () => {
    const q = currentQ(); if (!q) return;
    ui.draft = { title: q.title, giver: q.giver, lore: q.lore, objText: q.objectives.map(o => o.text).join('\n'), reward: q.reward, categoryId: q.categoryId, difficulty: q.difficulty, dest: q.status };
    ui.formErr = ''; ui.newCatOpen = false; ui.epicLast = null;
    ui.journal = { type: 'edit', id: q.id }; renderJournal(); $('journal').scrollTop = 0;
  },
  cancel: () => {
    if (ui.journal.type === 'edit'){ ui.journal = { type: 'quest', id: ui.journal.id }; ui.draft = null; renderJournal(); }
    else closeJournal();
  },
  save: () => saveForm(),
  epic: () => {
    const el = $('f-title'); let base = el.value.trim();
    if (!base){ ui.formErr = 'Type the plain task first, like "do the laundry", then make it epic.'; renderJournal(); $('f-title').focus(); return; }
    if (ui.epicLast && base === ui.epicLast) base = ui.epicBase; else ui.epicBase = base;
    const core = coreWords(base); let pick, tries = 0;
    do { pick = EPIC[Math.floor(Math.random() * EPIC.length)](core); } while (pick === ui.epicLast && ++tries < 8);
    ui.epicLast = pick; ui.draft.title = pick; el.value = pick;
    if (ui.formErr){ ui.formErr = ''; renderJournal(); }
    $('f-title').focus();
  },
  dice: () => {
    const el = $('f-giver'); let pick, tries = 0;
    do { pick = GIVERS[Math.floor(Math.random() * GIVERS.length)]; } while (pick === el.value && ++tries < 8);
    el.value = pick; ui.draft.giver = pick; el.focus();
  },
  'form-newcat': () => { ui.newCatOpen = true; renderJournal(); const i = $('f-newcat'); if (i) i.focus(); },
  'form-addcat': () => {
    const i = $('f-newcat'), name = i ? i.value.trim() : '';
    if (!name){ if (i) i.focus(); return; }
    const c = addCategory(name); ui.draft.categoryId = c.id; ui.newCatOpen = false;
    renderJournal(); renderAether(); renderFirmament(); toast('New island: ' + c.name);
  },
  'ask-del': () => { ui.confirm = 'del'; renderJournal(); },
  'confirm-no': () => { ui.confirm = null; renderJournal(); },
  'del-yes': () => {
    const q = currentQ(); if (!q) return;
    const msg = q.status === 'active' ? 'Quest abandoned' : q.status === 'rumor' ? 'The rumor drifted away' : 'Removed';
    state.quests = state.quests.filter(x => x.id !== q.id);
    if (state.followId === q.id) state.followId = null;
    if (ui.recallId === q.id) ui.recallId = null;
    persist(); closeJournal(); toast(msg);
  },
  again: () => {
    const q = currentQ(); if (!q) return;
    const c = { id: uid(), status: 'active', created: Date.now(), title: q.title, giver: q.giver, lore: q.lore, reward: q.reward, categoryId: q.categoryId, difficulty: q.difficulty, objectives: mkObjs(q.objectives.map(o => o.text)) };
    state.quests.push(c);
    if (!state.quests.some(x => x.id === state.followId && x.status === 'active')) state.followId = c.id;
    persist(); ui.journal = { type: 'quest', id: c.id }; ui.vStage = null; renderAll(); $('journal').scrollTop = 0;
    toast('Quest taken on again');
  },
  'see-star': () => {
    const q = currentQ(); if (!q) return;
    ui.highlight = q.id; closeJournal(); scrollFirmTo(q.id); go(0, { keepScroll: true });
    setTimeout(() => { if (ui.highlight === q.id) ui.highlight = null; }, 7000);
  },
  recall: () => {
    const all = state.quests.filter(q => q.status === 'done' && q.id !== ui.recallId);
    if (all.length) ui.recallId = all[Math.floor(Math.random() * all.length)].id;
    renderRoots();
  },
  filter: el => { ui.rootsFilter = el.dataset.cat; renderRoots(); },
  'color-open': el => { ui.colorOpen = ui.colorOpen === el.dataset.id ? null : el.dataset.id; renderJournal(); },
  'set-color': el => { const c = catById(el.dataset.id); if (c){ c.color = el.dataset.color; persist(); } ui.colorOpen = null; renderJournal(); renderAether(); renderFirmament(); renderRoots(); },
  'cat-up': el => moveCat(el.dataset.id, -1),
  'cat-down': el => moveCat(el.dataset.id, 1),
  'cat-del': el => { ui.confirm = 'cat:' + el.dataset.id; renderJournal(); },
  'cat-del-yes': el => {
    const id = el.dataset.id, other = state.categories.find(c => c.id !== id); if (!other) return;
    state.quests.forEach(q => { if (q.categoryId === id) q.categoryId = other.id; });
    state.categories = state.categories.filter(c => c.id !== id);
    ui.confirm = null; persist(); renderJournal(); renderAether(); renderFirmament(); renderRoots();
  },
  'add-cat': () => {
    const i = $('s-newcat'), name = i ? i.value.trim() : '';
    if (!name){ if (i) i.focus(); return; }
    addCategory(name); renderJournal(); renderAether(); renderFirmament();
    const n = $('s-newcat'); if (n){ n.value = ''; n.focus(); }
  },
  export: () => exportBackup(),
  import: () => $('import-file').click(),
  'import-yes': () => { state = Object.assign(ui.importData, { xpBy: state.xpBy, deleted: state.deleted || {}, pristine: false }); ui.importData = null; persist(); ui.recallId = null; ui.rootsFilter = 'all'; closeJournal(); toast('Backup restored'); },
  'import-no': () => { ui.importData = null; renderJournal(); },
  reset: () => { ui.confirm = 'reset'; renderJournal(); },
  'reset-yes': () => {
    state = { version: 2, worldName: state.worldName, xp: 0, followId: null, categories: defaultCategories(), quests: [], lastExport: state.lastExport, seenHint: true, xpBy: state.xpBy, deleted: state.deleted || {}, nameAt: state.nameAt, followAt: state.followAt, pristine: false };
    persist(); ui.recallId = null; ui.rootsFilter = 'all'; closeJournal(); go(1); toast('A fresh, empty aether');
  },
  'sync-connect': () => { const i = $('s-token'); connectSync(i ? i.value : ''); },
  'sync-now': () => { syncNow('manual'); },
  'sync-off': () => { ui.confirm = 'sync-off'; renderJournal(); },
  'sync-off-yes': () => { disconnectSync(); },
  'sync-link': () => { copySetupLink(); },
  'slide-to': el => { const a = document.querySelector('#aether .archipelago'); if (!a) return; const c = [...a.children].filter(e => e.classList.contains('cluster'))[+el.dataset.i]; if (c) a.scrollTo({ left: c.offsetLeft + c.offsetWidth / 2 - a.clientWidth / 2, behavior: reduced ? 'auto' : 'smooth' }); },
  slide: el => { const a = document.querySelector('#aether .archipelago'); if (!a) return; const c = a.querySelector('.cluster'); a.scrollBy({ left: (+el.dataset.dir) * ((c ? c.offsetWidth : 300) + 28), behavior: reduced ? 'auto' : 'smooth' }); },
  'v-undo': () => { const id = ui.victory && ui.victory.id; hideVictory(); uncompleteQuest(getQ(id)); renderAll(); go(1); toast('Undone. The quest is back on its island.'); },
  uncomplete: () => { const q = currentQ(); if (!q) return; uncompleteQuest(q); ui.vStage = null; renderAll(); toast('Back to active. The XP for finishing it was taken back.'); },
  'v-return': () => { hideVictory(); go(1); renderFirmament(); },
  'v-stay': () => { hideVictory(); renderFirmament(); }
};
function moveCat(id, dir){
  const i = state.categories.findIndex(c => c.id === id), k = i + dir;
  if (i < 0 || k < 0 || k >= state.categories.length) return;
  const arr = state.categories; [arr[i], arr[k]] = [arr[k], arr[i]];
  persist(); renderJournal(); renderAether(); renderFirmament();
}

/* ================= events ================= */
document.addEventListener('click', e => {
  if (e.target.id === 'veil'){ closeJournal(); return; }
  const el = e.target.closest('[data-action],[data-go]');
  if (!el || el.disabled) return;
  if (el.dataset.go !== undefined && !el.dataset.action){ go(+el.dataset.go); return; }
  const f = A[el.dataset.action]; if (!f) return;
  const keep = ['ask-del', 'del-yes', 'cat-del', 'cat-del-yes', 'reset', 'reset-yes', 'confirm-no', 'sync-off', 'sync-off-yes'].includes(el.dataset.action);
  if (!keep) ui.confirm = null;
  f(el, e);
});
document.addEventListener('scroll', e => {
  const t = e.target; if (!t || !t.classList) return;
  if (t.classList.contains('archipelago')){ ui.slide = t.scrollLeft; updateArchNav(); }
  else if (t.classList.contains('ceiling-track') || t.id === 'scroll-0') ui.slide = t.scrollLeft;
}, true);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.field && ui.draft){ ui.draft[t.dataset.field] = t.value; return; }
  if (t.id === 's-name'){ state.worldName = t.value.slice(0, 40); persist(); renderAether(); return; }
  if (t.dataset.catname){ const c = catById(t.dataset.catname); if (c){ c.name = t.value.slice(0, 40); persist(); renderAether(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'f-cat' && ui.draft){ ui.draft.categoryId = t.value; renderJournal(); }
  else if (t.name === 'f-diff' && ui.draft) ui.draft.difficulty = t.value;
  else if (t.name === 'f-dest' && ui.draft) ui.draft.dest = t.value;
  else if (t.id === 's-tz'){ skyCfg.tz = t.value; saveSky(); applyPhase(wantedPhase()); renderJournal(); }
  else if (t.name === 's-lock'){ skyCfg.lock = t.value; saveSky(); applyPhase(wantedPhase()); renderJournal(); }
  else if (t.id === 'import-file'){ handleImport(t.files[0]); t.value = ''; }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.id === 's-name' && !t.value.trim()){ state.worldName = 'My Aether'; t.value = state.worldName; persist(); renderAether(); }
  if (t.dataset && t.dataset.catname && !t.value.trim()){ const c = catById(t.dataset.catname); if (c){ c.name = 'Unnamed'; t.value = c.name; persist(); renderAether(); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (!$('victory').hidden){ hideVictory(); renderFirmament(); return; }
    if (ui.journal){ closeJournal(); return; }
  }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('g.star')){ e.preventDefault(); openJournal({ type: 'quest', id: t.dataset.id }, t); return; }
  if (e.key !== 'Enter') return;
  if (t.id === 'add-step'){ e.preventDefault(); addStep(); }
  else if (t.id === 'f-newcat'){ e.preventDefault(); A['form-addcat'](); }
  else if (t.id === 's-newcat'){ e.preventDefault(); A['add-cat'](); }
  else if (t.id === 's-token'){ e.preventDefault(); A['sync-connect'](); }
  else if (t.id === 'f-title' || t.id === 'f-giver' || t.id === 'f-reward'){ e.preventDefault(); }
});
const fc = $('firm-canvas');
fc.addEventListener('pointerover', e => { const g = e.target.closest('.star'); if (g) showTip(g); });
fc.addEventListener('pointerout', e => { const g = e.target.closest('.star'); if (g && !g.contains(e.relatedTarget)) hideTip(); });
fc.addEventListener('focusin', e => { const g = e.target.closest('.star'); if (g) showTip(g); });
fc.addEventListener('focusout', hideTip);
let rz = null;
window.addEventListener('resize', () => {
  document.documentElement.style.setProperty('--vh', innerHeight + 'px');
  applyCamera(true);
  clearTimeout(rz); rz = setTimeout(() => { renderFirmament(); if (ui.zone === 0) scrollers[0].scrollTop = scrollers[0].scrollHeight; paintAetherBackdrop(); drawStreams(); renderRoots(); }, 220);
});

/* ================= start ================= */
document.documentElement.style.setProperty('--vh', innerHeight + 'px');
canSave = storageTest();
DEVICE = deviceId(); loadSync();
const saved = canSave ? load() : null;
state = saved || seed();
initLedger(); takeSnap();
if (!saved) persist({ quiet: true });
const firstVisit = !saved;
ui.zone = (firstVisit && !reduced) ? 0 : 1;
loadSky(); phaseName = wantedPhase(); PH = PHASES[phaseName]; setPhaseVars();
applyCamera(true); setInert(); renderAll();
setTimeout(() => { try { makeCloudSprites(); document.documentElement.style.setProperty('--root-tile', `url(${rootTileURL()})`); } catch (e) { console.error(e); } paintAetherBackdrop(); drawStreams(); }, 40);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawStreams);
scrollers[0].scrollTop = scrollers[0].scrollHeight;
document.body.dataset.zone = ui.zone; sleepZones();
if (firstVisit && !reduced) setTimeout(() => go(1), 1100);
startSync();
setInterval(() => { if (!document.hidden && !ui.journal) rotateSayings(ui.zone, true); }, 50000);
setInterval(checkPhase, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkPhase(); });
if (!canSave) setTimeout(() => toast("This browser isn't letting the page save. Export a backup in Settings before closing."), 900);
})();
</script>
